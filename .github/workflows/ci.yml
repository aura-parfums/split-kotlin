name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check local runner syntax
        run: |
          node --check backend/runner/server.mjs
          node --check backend/runner/preview-discovery.mjs
          node --check backend/runner/compile-preview-fixture.mjs
      - name: Test Compose preview discovery
        run: node --test backend/runner/preview-discovery.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build web workspace
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate Compose preview compile fixture
        run: node backend/runner/compile-preview-fixture.mjs
      - name: Compile starter Compose project
        working-directory: backend/projects/hello-compose
        run: gradle :app:assembleDebug --stacktrace
